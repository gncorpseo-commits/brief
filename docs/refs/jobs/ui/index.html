<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brief — 공고 레퍼런스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">Brief</span>
      <span class="brand-sub">공고 레퍼런스</span>
    </div>
    <div class="toolbar">
      <input id="q" type="search" placeholder="제목·태그·URL 검색" autocomplete="off" />
      <select id="kind">
        <option value="">전체 종류</option>
        <option value="posting">posting</option>
        <option value="pattern">pattern</option>
        <option value="guide">guide</option>
      </select>
    </div>
  </header>

  <main class="layout">
    <aside class="list-pane">
      <p class="meta" id="meta">불러오는 중…</p>
      <ul id="list" class="list"></ul>
    </aside>
    <section class="detail-pane" id="detail">
      <div class="empty">
        <h1>공고를 선택하세요</h1>
        <p>왼쪽 목록에서 레퍼런스를 고르면 상세와 원본 JSON을 볼 수 있습니다.</p>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
