<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Brief — 공고 레퍼런스</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=Outfit:wght@400;500;600;700&family=Source+Serif+4:opsz,wght@8..60,500;8..60,600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="./styles.css" />
</head>
<body>
  <div class="bg" aria-hidden="true"></div>
  <header class="top">
    <div class="brand">
      <span class="brand-mark">Brief</span>
      <span class="brand-sub">공고 레퍼런스</span>
    </div>
    <div class="toolbar">
      <span id="health" class="health">API …</span>
      <input id="q" type="search" placeholder="제목·태그·URL 검색" autocomplete="off" />
      <select id="kind">
        <option value="">전체 종류</option>
        <option value="posting">posting</option>
        <option value="pattern">pattern</option>
        <option value="guide">guide</option>
      </select>
      <button type="button" id="tab-browse" class="tab-btn active">목록</button>
      <button type="button" id="tab-work" class="tab-btn">구조화·초안</button>
    </div>
  </header>

  <main class="layout" id="view-browse">
    <aside class="list-pane">
      <p class="meta" id="meta">불러오는 중…</p>
      <ul id="list" class="list"></ul>
    </aside>
    <section class="detail-pane" id="detail">
      <div class="empty">
        <h1>공고를 선택하세요</h1>
        <p>왼쪽 목록에서 레퍼런스를 고르면 상세와 원본 JSON을 볼 수 있습니다.</p>
      </div>
    </section>
  </main>

  <main class="work-layout" id="view-work" hidden>
    <section class="work-panel">
      <h1 class="work-title">공고 구조화</h1>
      <p class="work-lead">원문을 붙여넣으면 JobRef JSON을 만들고, 이어서 지원 초안을 생성합니다.</p>
      <label class="field">
        <span>공고 페이지 URL</span>
        <input id="work-url" type="url" placeholder="https://..." />
      </label>
      <label class="field">
        <span>공고 원문</span>
        <textarea id="work-text" rows="12" placeholder="공고 본문을 붙여넣으세요 (20자 이상)"></textarea>
      </label>
      <label class="check">
        <input id="work-heuristic" type="checkbox" />
        Ollama 없이 휴리스틱만 사용
      </label>
      <div class="work-actions">
        <button type="button" id="btn-structure" class="primary">구조화 (structure)</button>
        <button type="button" id="btn-draft" class="secondary" disabled>지원 초안 (draft)</button>
        <button type="button" id="btn-apply" class="secondary" disabled>승인 후 지원 기록 (--yes)</button>
      </div>
      <p class="meta" id="work-status"></p>
      <div class="panel work-out">
        <h2>결과</h2>
        <pre id="work-out" class="json-view">(아직 없음)</pre>
      </div>
    </section>
  </main>

  <script src="./app.js"></script>
</body>
</html>
