[project]
name = "brief"
version = "0.1.0"
description = "Local-first remote job assist agent (JobRef → draft → apply → work agents)"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pydantic>=2.6",
  "typer>=0.12",
  "httpx>=0.27",
  "rich>=13.7",
  "python-dotenv>=1.0",
]

[project.scripts]
brief = "brief.cli:app"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
